<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Chargement · DropLink</title>
<meta name="robots" content="noindex">
<link rel="preload" href="assets/fonts/inter-latin.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="styles.css">

<body class="page-app v4">
<!--ICONES-->
<a class="evitement" href="#contenu">Aller au contenu</a>

<!-- Maquette de l'écran de chargement de l'espace vendeur (droplink2 : src/app/[locale]/(app)/loading.tsx) : un titre, une ligne, huit lignes de liste. Masqué aux lecteurs d'écran, comme dans le produit. -->
<!--COQUE:commandes-->
    <main id="contenu" class="tableau squelette" data-ecran aria-busy="true">
      <p class="sr" role="status">Chargement…</p>
      <div class="squelette__corps" aria-hidden="true">
        <i class="sq sq--titre"></i>
        <i class="sq sq--ligne"></i>
        <div class="squelette__liste">
          <div class="squelette__rangee" style="--i:0"><i class="sq sq--tuile"></i><div><i class="sq sq--l1"></i><i class="sq sq--l2"></i></div></div>
          <div class="squelette__rangee" style="--i:1"><i class="sq sq--tuile"></i><div><i class="sq sq--l1"></i><i class="sq sq--l2"></i></div></div>
          <div class="squelette__rangee" style="--i:2"><i class="sq sq--tuile"></i><div><i class="sq sq--l1"></i><i class="sq sq--l2"></i></div></div>
          <div class="squelette__rangee" style="--i:3"><i class="sq sq--tuile"></i><div><i class="sq sq--l1"></i><i class="sq sq--l2"></i></div></div>
          <div class="squelette__rangee" style="--i:4"><i class="sq sq--tuile"></i><div><i class="sq sq--l1"></i><i class="sq sq--l2"></i></div></div>
          <div class="squelette__rangee" style="--i:5"><i class="sq sq--tuile"></i><div><i class="sq sq--l1"></i><i class="sq sq--l2"></i></div></div>
          <div class="squelette__rangee" style="--i:6"><i class="sq sq--tuile"></i><div><i class="sq sq--l1"></i><i class="sq sq--l2"></i></div></div>
          <div class="squelette__rangee" style="--i:7"><i class="sq sq--tuile"></i><div><i class="sq sq--l1"></i><i class="sq sq--l2"></i></div></div>
        </div>
      </div>
    </main>
  </div>
</div>

<p class="toast" role="status" aria-live="polite" data-toast></p>

<script src="coque.js" defer></script>
<script src="v4.js" defer></script>
<script src="etats.js" defer></script>
</body>
</html>
