<!DOCTYPE html><html class="light" lang="en"><head>
<meta charset="utf-8">
<meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" name="viewport">

<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet">

        tailwind.config = {

                        "secondary": "#0058be",
                        "outline": "#76777d",

                        "on-secondary-fixed-variant": "#004395",
                        "primary": "#000000",
                        "on-error": "#ffffff",
                        "on-surface": "#191c1e",
                        "surface-container-highest": "#e0e3e5",
                        "on-background": "#191c1e",
                        "on-tertiary-container": "#75859d",
                        "inverse-surface": "#2d3133",
                        "tertiary-fixed": "#d3e4fe",
                        "primary-container": "#131b2e",
                        "primary-fixed": "#dae2fd",
                        "surface-tint": "#565e74",
                        "primary-fixed-dim": "#bec6e0",

                        "surface-container-low": "#f2f4f6",

                        "on-secondary": "#ffffff",

                    "spacing": {
                        "margin-mobile": "16px",
                        "container-max": "1440px",
                        "gutter": "24px",
                        "margin-desktop": "40px",
                        "base": "8px",
                        "safe": "env(safe-area-inset-bottom)"
                    },
                    "fontFamily": {
                        "headline-lg": ["Plus Jakarta Sans"],
                        "label-sm": ["Inter"],
                        "headline-lg-mobile": ["Plus Jakarta Sans"],
                        "body-lg": ["Inter"],
                        "body-md": ["Inter"],
                        "headline-md": ["Plus Jakarta Sans"],
                        "headline-xl": ["Plus Jakarta Sans"],
                        "body-sm": ["Inter"],
                        "label-md": ["Inter"]
                    },
                    "fontSize": {
                        "headline-lg": ["32px", { "lineHeight": "40px", "letterSpacing": "-0.02em", "fontWeight": "600" }],
                        "label-sm": ["12px", { "lineHeight": "16px", "fontWeight": "500" }],
                        "headline-lg-mobile": ["24px", { "lineHeight": "32px", "fontWeight": "600" }],
                        "body-lg": ["18px", { "lineHeight": "28px", "fontWeight": "400" }],
                        "body-md": ["16px", { "lineHeight": "24px", "fontWeight": "400" }],
                        "headline-md": ["24px", { "lineHeight": "32px", "fontWeight": "600" }],
                        "headline-xl": ["40px", { "lineHeight": "48px", "letterSpacing": "-0.02em", "fontWeight": "700" }],
                        "body-sm": ["14px", { "lineHeight": "20px", "fontWeight": "400" }],
                        "label-md": ["14px", { "lineHeight": "16px", "letterSpacing": "0.01em", "fontWeight": "600" }]
                    }
                }
            }
        }

<style>
        body { -webkit-tap-highlight-color: transparent; }
        .glass-card {
            background: rgba(255, 255, 255, 0.7);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.4);
        }
        .hide-scrollbar::-webkit-scrollbar { display: none; }
        .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
</head>
<body class="bg-surface text-on-surface antialiased min-h-screen pb-24 md:hidden flex flex-col">
<!-- TopAppBar -->
<header class="bg-surface-container-lowest/70 backdrop-blur-xl dark:bg-surface-dim/70 fixed top-0 w-full z-50 border-b border-outline-variant/30 shadow-sm transition-all duration-200 active:scale-95 flex justify-between items-center px-margin-mobile h-16 w-full">
<button class="text-secondary dark:text-secondary-fixed-dim hover:bg-surface-variant/50 p-2 rounded-full flex items-center justify-center">
<span class="material-symbols-outlined" data-icon="menu">menu</span>
</button>
<img src="https://lh3.googleusercontent.com/aida/AP1WRLscsJ2ZPeCeTCUFaWNgdvkllr9rJsAL28P_z0Cllk9G8X3gOQrOyxEbBVqyZQ4LOLiPQhxKF1Q_C64n92RaIGPHBsovdMU-bcm1FP5N97RKDTjaKTd5mFuLPYqB6PGW3Y4e0lrCe0StCGW6V0R1MBO3DWwGfon3lmGbJ23RqBQ8bkfxoLcjUUc3q1K9enscFjzqx3f2PfxSvpnn4ujW_vviFBpdiUI5xzl6Pe2MJk8S_XcTSUQQvol5OSU" alt="DropLink Logo" class="h-8 w-auto object-contain">
<div class="h-8 w-8 rounded-full overflow-hidden bg-surface-variant">
<img src="https://lh3.googleusercontent.com/aida/AP1WRLvacHjqo_zt14fACteBFrFDvTZxZmQBDqp-NIngXxUYwIkVlUaBtKe-0l2d5CA5vW63wfrVWjwCXJBEzPxtnD_zv8FDNEy8wzbAH9BXhUrlvXHk5pjJ_5nLlI109QeubhDPalObsZ55fR3idk-_OZXi3WjQImPxzPu2xgaVK-sKdyTaTlCpkPyjzLlkLBNwNJ80Wct77PfN9-WnTBtO7g4uhVxCWHoOLx8lsyFxku3-V4dw6xsNpODhw5w" alt="DropLink Logo" class="w-full h-full object-cover">
</div>
</header>
<!-- Main Content -->
<main class="flex-1 pt-20 px-margin-mobile pb-8 space-y-6">
<!-- Fast-QC Action -->
<section class="mt-2">
<button class="w-full bg-secondary text-on-secondary rounded-xl py-4 px-6 flex items-center justify-center gap-3 shadow-md active:shadow-none transition-shadow duration-200">
<span class="material-symbols-outlined" data-icon="camera_enhance" style="font-variation-settings: 'FILL' 1;">camera_enhance</span>
<span class="font-label-md text-label-md text-lg">Start New Audit</span>
</button>
</section>
<!-- Metrics Snippet (Simplified for Mobile) -->
<section class="grid grid-cols-2 gap-4">
<div class="glass-card rounded-xl p-4 flex flex-col gap-1 shadow-sm">
<span class="font-label-sm text-label-sm text-on-surface-variant">Today's Audits</span>
<span class="font-headline-lg-mobile text-headline-lg-mobile text-secondary font-bold">24</span>
</div>
<div class="glass-card rounded-xl p-4 flex flex-col gap-1 shadow-sm">
<span class="font-label-sm text-label-sm text-on-surface-variant">Pass Rate</span>
<span class="font-headline-lg-mobile text-headline-lg-mobile text-[#16a34a] font-bold">92%</span>
</div>
</section>
<!-- Filters -->
<section>
<div class="flex gap-2 overflow-x-auto hide-scrollbar pb-2">
<button class="whitespace-nowrap px-4 py-2 rounded-full bg-secondary-fixed text-on-secondary-fixed font-label-sm text-label-sm shadow-sm">All Recent</button>
<button class="whitespace-nowrap px-4 py-2 rounded-full bg-surface-container text-on-surface-variant font-label-sm text-label-sm border border-outline-variant/30">Passed</button>
<button class="whitespace-nowrap px-4 py-2 rounded-full bg-surface-container text-on-surface-variant font-label-sm text-label-sm border border-outline-variant/30">Flagged</button>
</div>
</section>
<!-- Recent Audits List -->
<section class="space-y-4">
<h2 class="font-headline-md-mobile text-headline-md-mobile text-on-surface">Recent Audits</h2>
<div class="space-y-3">
<!-- Audit Item 1 -->
<div class="glass-card rounded-xl overflow-hidden shadow-sm flex flex-col">
<div class="relative h-32 w-full bg-surface-container-high">
<img alt="Audit photo" class="w-full h-full object-cover" data-alt="Close up shot of warehouse inventory boxes stacked neatly on a pallet, bright clean warehouse lighting, shallow depth of field focusing on a barcode label, corporate modern logistics style." src="https://lh3.googleusercontent.com/aida-public/AB6AXuAFw6DROaPyGc95nkqPASX0xc1QajgpNauIYjkIwkr4YAUqsMPepuv5RsA0-l4nZjXa0TzYHUbFqzPvHJwrIFoTMSiW-TUBKNRezGxy40FlNIw5lwq-zbgCKIY7DAmB1yjZ8JYsJWk8OIr3kkVY3ZQ7H-Os9a4wG4TxHjoxcS8rx3wUT3Ic5E3NoaFGhkMwVCAkKtehAIT7FVPdSLPaAwRbNNVLnfBqEIUCUR1ohVyQ4ozP7IDNnAi0">
<div class="absolute top-2 right-2 bg-[#16a34a]/10 backdrop-blur-md border border-[#16a34a]/30 rounded-full px-2 py-1 flex items-center gap-1">
<span class="material-symbols-outlined text-[14px] text-[#16a34a]" data-icon="check_circle">check_circle</span>
<span class="font-label-sm text-label-sm text-[#16a34a]">Passed</span>
</div>
</div>
<div class="bg-surface-container-low p-3 flex justify-between items-center">
<div class="flex flex-col">
<span class="font-label-md text-label-md text-on-surface">Pallet A-42</span>
<span class="font-body-sm text-body-sm text-on-surface-variant">10:45 AM • Zone 3</span>
</div>
<button class="text-secondary p-1">
<span class="material-symbols-outlined" data-icon="chevron_right">chevron_right</span>
</button>
</div>
</div>
<!-- Audit Item 2 -->
<div class="glass-card rounded-xl overflow-hidden shadow-sm flex flex-col">
<div class="relative h-32 w-full bg-surface-container-high">
<img alt="Audit photo" class="w-full h-full object-cover" data-alt="A slightly damaged cardboard shipping box on a conveyor belt in a modern logistics facility, clear lighting highlighting the dented corner, professional documentary style photography." src="https://lh3.googleusercontent.com/aida-public/AB6AXuDh7mTKcAVKwVjzF2QiJr79qNA_rhgqCxIg7iGOaXWydYoSEfMUCelTLF8Kp8eUq2ypz8zv0saPaMeAg8NwUg88oN-oi2O6vw1_5TkW076Sd50T_-rr0QBij6RM8Xa0k3Ah8Sq9hVcAyVmn-e8X8c92r67AEa6_SYSXUpi0IRy70T4Q8Zbb3uaTNNPMWCqXAECu4KdUrml2S9mG9wvc6dqQYqsApauZu1WxW1HUVxEp3WYRM37QQEkj">
<div class="absolute top-2 right-2 bg-error/10 backdrop-blur-md border border-error/30 rounded-full px-2 py-1 flex items-center gap-1">
<span class="material-symbols-outlined text-[14px] text-error" data-icon="warning">warning</span>
<span class="font-label-sm text-label-sm text-error">Flagged</span>
</div>
</div>
<div class="bg-surface-container-low p-3 flex justify-between items-center">
<div class="flex flex-col">
<span class="font-label-md text-label-md text-on-surface">Box DMG-09</span>
<span class="font-body-sm text-body-sm text-on-surface-variant">09:12 AM • Loading Dock</span>
</div>
<button class="text-secondary p-1">
<span class="material-symbols-outlined" data-icon="chevron_right">chevron_right</span>
</button>
</div>
</div>
</div>
</section>
</main>
<!-- BottomNavBar -->
<nav class="bg-surface-container-lowest/80 backdrop-blur-md dark:bg-surface-container-high/80 fixed bottom-0 w-full z-50 border-t border-outline-variant/20 shadow-lg flex justify-around items-center h-16 px-4 pb-safe">
<button class="flex flex-col items-center justify-center text-on-surface-variant active:bg-surface-variant/30 scale-110 transition-transform duration-300 w-16">
<span class="material-symbols-outlined mb-1" data-icon="home">home</span>
<span class="font-label-sm text-label-sm">Home</span>
</button>
<button class="flex flex-col items-center justify-center text-secondary dark:text-secondary-fixed font-bold active:bg-surface-variant/30 scale-110 transition-transform duration-300 w-16">
<span class="material-symbols-outlined mb-1" data-icon="camera_enhance" data-weight="fill" style="font-variation-settings: 'FILL' 1;">camera_enhance</span>
<span class="font-label-sm text-label-sm">Audits</span>
</button>
<button class="flex flex-col items-center justify-center text-on-surface-variant active:bg-surface-variant/30 scale-110 transition-transform duration-300 w-16">
<span class="material-symbols-outlined mb-1" data-icon="package_2">package_2</span>
<span class="font-label-sm text-label-sm">Inventory</span>
</button>
<button class="flex flex-col items-center justify-center text-on-surface-variant active:bg-surface-variant/30 scale-110 transition-transform duration-300 w-16">
<span class="material-symbols-outlined mb-1" data-icon="groups">groups</span>
<span class="font-label-sm text-label-sm">Directory</span>
</button>
</nav>




</body></html>
